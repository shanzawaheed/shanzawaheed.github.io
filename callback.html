<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish connecting | QuickBook Invoice Connector</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .box{width:100%;min-height:96px;font:14px/1.5 Consolas,monospace;padding:12px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);word-break:break-all;resize:vertical}
  .copy{margin-top:14px;border:0;cursor:pointer}
  .ok{color:var(--green);font-weight:700;margin-left:12px}
  .err{background:#fbeceb;border-left:4px solid var(--stamp);padding:12px 16px;border-radius:0 8px 8px 0}
</style></head>
<body>
<header class="site-head"><div class="wrap"><a class="brand" href="index.html">QuickBook Invoice Connector</a></div></header>
<main><section class="doc"><div class="wrap"><article>
<h1>One last step</h1>
<p class="eff">Copy the text below and paste it into the connector's setup window, where it asks for it.</p>
<div id="error" class="err" hidden></div>
<label for="url" class="visually-hidden">Connection address</label>
<textarea id="url" class="box" readonly></textarea>
<button class="btn copy" id="copy" type="button">Copy</button><span id="done" class="ok" role="status"></span>
<p style="margin-top:22px" class="muted">This page doesn't store or send anything. The code in this address works once, expires within minutes, and is useless without the connector's private key.</p>
</article></div></section></main>
<script>
  var box = document.getElementById("url");
  box.value = window.location.href;
  var q = new URLSearchParams(window.location.search);
  if (q.get("error")) {
    var e = document.getElementById("error");
    e.hidden = false;
    e.textContent = "The connection was not approved (" + q.get("error") + "). Close this page and run the setup again.";
  }
  document.getElementById("copy").addEventListener("click", function () {
    box.select();
    var done = function () { document.getElementById("done").textContent = "Copied"; };
    if (navigator.clipboard) { navigator.clipboard.writeText(box.value).then(done, function () { document.execCommand("copy"); done(); }); }
    else { document.execCommand("copy"); done(); }
  });
</script>
</body></html>
